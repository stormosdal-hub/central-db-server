# PostgreSQL-innstillinger for den sentrale serveren: en Raspberry Pi 5 med 8 GB og NVMe.
# Legges i /etc/postgresql/<versjon>/main/conf.d/kjoreverk.conf av deploy/install.sh. Har timescaledb-tune
# kjørt, har den satt minneinnstillinger i postgresql.conf; denne filen leses etterpå og vinner.
# Har Pi-en 4 GB, halver shared_buffers og effective_cache_size.

# minne
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 32MB
maintenance_work_mem = 512MB

# NVMe: tilfeldig lesing koster lite mer enn sekvensiell
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL og sjekkpunkter: jevnere skriving, mindre WAL
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# ALDRI slå av fsync eller full_page_writes: det er de som gjør at databasen tåler strømbrudd (docs/PLAN.md §3.8)
fsync = on
full_page_writes = on
synchronous_commit = on

# forbindelser: serveren bruker høyst 10, pluss kv-admin, backup og deg
max_connections = 50

# autovacuum følger med på tabeller som vokser fort
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# loggen: langsomme spørsmål, så de kan rettes
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %u@%d '
timezone = 'UTC'
