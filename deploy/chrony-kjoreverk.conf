# chrony på den sentrale serveren: tidskilden for alle kjøreverkene (docs/PLAN.md §3.7).
# Legges i /etc/chrony/conf.d/kjoreverk.conf (sudo apt install chrony; sudo systemctl restart chrony).
#
# Kjøreverkenes Pi-er peker på denne maskinen (README_systemd-service.md i HMI-prosjektet), og PLS-ene
# peker på sin Pi. Sjekk med: chronyc clients  (hvem som spør)  og  chronyc tracking  (vår egen kilde).

# serverens egen kilde: en NTP-server som finnes på nettet fra før, eller internett. Bytt ut adressen.
# Med GPS (gpsd + en u-blox-mottaker) legges en refclock til, se README §Klokka.
server ntp.example.local iburst
#pool 2.debian.pool.ntp.org iburst

# svar kjøreverkene: nettet de står på. Bytt ut med ditt.
allow 10.0.0.0/8
allow 192.168.0.0/16

# når kilden faller ut: fortsett å svare med vår egen klokke, så alle kjøreverkene holder samme tid
local stratum 10

# RTC-en på Pi 5 (sett i batteriet): skriv klokka dit, så tiden overlever et strømbrudd
rtcsync
